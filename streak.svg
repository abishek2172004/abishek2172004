<svg xmlns="http://www.w3.org/2000/svg" width="600" height="100" viewBox="0 0 600 100"><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.ink{fill:#24292f}.mid{fill:#57606a}.dim{fill:#8c959f}.line{stroke:#d0d7de}.accent{fill:#0969da}@media(prefers-color-scheme:dark){.ink{fill:#e6edf3}.mid{fill:#c9d1d9}.dim{fill:#8b949e}.line{stroke:#30363d}.accent{fill:#58a6ff}}</style><line x1="300" y1="18" x2="300" y2="86" class="line" stroke-width="1" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.10s" dur="0.50s" fill="freeze"/></line><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.50s" fill="freeze"/><text x="20" y="46" font-size="32" class="ink" text-anchor="start" font-weight="600">2</text><text x="20" y="66" font-size="11" class="mid" text-anchor="start" font-weight="normal">current streak</text><text x="20" y="82" font-size="10" class="dim" text-anchor="start" font-weight="normal">Sep 19 - Sep 20</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.30s" dur="0.50s" fill="freeze"/><text x="320.0" y="46" font-size="32" class="ink" text-anchor="start" font-weight="600">5</text><text x="320.0" y="66" font-size="11" class="mid" text-anchor="start" font-weight="normal">longest streak</text><text x="320.0" y="82" font-size="10" class="dim" text-anchor="start" font-weight="normal">Sep 7 - Sep 11</text></g></svg>