name: refresh profile stats

# No `push` trigger on purpose: this job commits the regenerated SVGs, and a
# push trigger would make it re-run on its own commit forever.
on:
  schedule:
    - cron: "15 3 * * *"   # once a day
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Generate the stat graphics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate_stats.py

      - name: Commit changes, if any
        run: |
          if [ -z "$(git status --porcelain -- stats.svg streak.svg langs.svg year.svg)" ]; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg streak.svg langs.svg year.svg
          git commit -m "chore: refresh profile stats"
          git push
